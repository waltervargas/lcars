# wob on-screen bar, LCARS colours. The bar colour per value (volume, brightness,
# muted) comes from sway/scripts/osd.sh; these are the defaults and geometry.
timeout = 1000
max = 100
width = 420
height = 34
border_offset = 0
border_size = 2
bar_padding = 6
anchor = bottom center
margin = 48
background_color = 000000
border_color = FF9900
bar_color = 9999FF
overflow_mode = nowrap
